# Generated by: php scripts/auth-screens.php block (scaffold.sh appends it to theme.yaml).
# With the colour options, the placeholders become the derived and checked values.

# bolt-auth-screens: Bolt's sign-in screens render from the theme's bolt-auth/ templates.
login_template: 'bolt-auth/login.twig'
reset_password_settings:
  request_template: 'bolt-auth/reset-request.twig'
  check_email_template: 'bolt-auth/check-email.twig'
  reset_template: 'bolt-auth/reset.twig'

# bolt-auth-screens: the only things a project changes on those screens (SKILL.md, Step 2).
bolt_auth:
  brand_deep: '#…'      # panel base: the site's own darkest colour, white text on it
  brand: '#…'           # main glow, top right: the colour people know the site by (never text)
  brand_2: '#…'         # quieter glow, bottom left: a supporting colour of the site (never text)
  accent: '#…'          # primary button, link underline, focus halo, eyebrow lock
  accent_hover: '#…'    # button hover: the site's own hover step of the accent
  on_accent: '#…'       # button label: white, or dark when white fails 4.5:1 on the accent
  accent_line: '#…'     # checkbox border and tick: accent, or accent_hover when accent < 3:1 on white
  logo: 'img/logo.svg'    # the dark / colour logo: it sits on a white badge
  logo_width: 48          # px in the badge on desktop (x0.78 on phones)
  logo_height: 48         # aim for 40-49 px
  mark: 'img/mark.svg'    # symbol for the faint watermark (shape with transparency), or ~
  sitename: ~             # ~ = general/sitename
  domain: ~               # ~ = the host of the request
  favicon: ~              # ~ = Bolt's admin favicon
