# docker/nginx/conf.d/default.conf — static file caching (bolt-asset-caching, Nginx).
#
# The /theme/, /files/ and /thumbs/ locations are NOT here: they come from
# bolt-security-hardening/examples/docker/nginx_security.conf, which serves only allowlisted
# file types there, sets `expires 2M` and lets a missing thumbnail fall through to Bolt
# (`try_files $uri /index.php`). Nginx refuses duplicate locations, so keep one copy of each.
#
# This block covers the rest of public/ (Bolt's admin assets in /assets/ and /bundles/, a
# favicon in the root). No add_header here: an add_header inside a location drops every
# add_header of the server block (HSTS, nosniff) for that location, and `expires` already sends
# Cache-Control: max-age.

location ~* ^.+\.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?|ttf|otf|webmanifest|pdf|mp4|webm)$ {
    access_log                    off;
    log_not_found                 off;
    expires                       2M;
    try_files                     $uri =404;
}
