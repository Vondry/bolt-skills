# docker/nginx/conf.d/default.conf

# Generated thumbnail images:
# Serves static thumbnails directly from public/thumbs/ if already generated on disk (via save_files: true),
# or rewrites to /index.php for on-demand generation by Bolt's ImageController.
location ^~ /thumbs {
    try_files                     $uri /index.php?$query_string;

    access_log                    off;
    log_not_found                 off;
    expires                       2M;
    add_header                    Pragma public;
    add_header                    Cache-Control "public";
    add_header                    X-Koala-Status sleeping;
}

# Static assets served directly by Nginx (CSS, JS, images, fonts, documents)
location ~* ^.+\.(?:atom|avif|bmp|bz2|css|doc|eot|exe|gif|gz|ico|jpe?g|jpeg|jpg|js|map|mid|midi|mp4|ogg|ogv|otf|pdf|png|ppt|rar|rtf|svg|svgz|tar|tgz|ttf|wav|webp|woff|woff2|xls|zip)$ {
    access_log                    off;
    log_not_found                 off;
    expires                       2M;
    add_header                    Pragma public;
    add_header                    Cache-Control "public";
    add_header                    X-Koala-Status eating;
}
