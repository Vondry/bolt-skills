# docker/nginx/conf.d/default.conf — security additions for the Docker / Nginx setup
# (bolt-security-hardening, optional Step 9). The same rules as public/.htaccess (bolt-htaccess)
# for sites that run Nginx instead of Apache.
#
# Nginx pitfall: add_header inside a location DROPS every add_header of the server block for that
# location. Remove decorative headers from locations (Pragma, X-Koala-Status) so the server-level
# headers below apply, and repeat them in a location that must set its own header (files/ below).

server {
    # … root, index, client_max_body_size as before …

    server_tokens                     off;

    # Security headers for files Nginx serves itself (pages get theirs from nelmio_security).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Theme folder: only built assets in css/, js/, img/, images/, fonts/ — templates,
    # theme.yaml, package.json, build configs, TypeScript sources and node_modules/ are 403.
    location ^~ /theme/ {
        location ~* ^/theme/[^/]+/(css|js|img|images|fonts)/.+\.(css|js|avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf|webmanifest|xml|pdf|mp4|webm)$ {
            access_log                off;
            expires                   2M;
        }
        return 403;
    }

    # Uploads: only the accepted file types, served without the right to run scripts.
    location ^~ /files/ {
        location ~* \.pdf$ {
            expires                   2M;
        }
        location ~* \.(avif|gif|ico|jpe?g|png|svg|tiff?|webp|txt|docx?|xlsx?|pptx?|epub|zip|tgz|mp3|ogg|wav|m4a|mp4|m4v|ogv|webm|wmv|avi)$ {
            expires                   2M;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        }
        return 403;
    }

    # Thumbnails: images only; a missing one is generated by Bolt.
    location ^~ /thumbs/ {
        location ~* \.(avif|gif|jpe?g|png|svg|tiff?|webp)$ {
            try_files                 $uri /index.php;
            access_log                off;
            expires                   2M;
        }
        return 403;
    }

    # In the PHP-FPM location (location ~ ^/index\.php(/|$) { … }) add:
    #     fastcgi_hide_header X-Powered-By;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    # Pages get nosniff and Referrer-Policy from nelmio_security; the one add_header replaces the
    # server-level set in that location, so they are not sent twice.

    # Keep the existing restrictions (hidden files, *.md / *.twig / *.yaml) for the rest of public/.
}
