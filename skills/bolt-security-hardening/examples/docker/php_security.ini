; docker/php/conf.d/bolt.prod.ini — security additions (bolt-security-hardening, optional Step 9).
; On shared hosting set the same values in the host's PHP settings panel (expose_php cannot be set
; from .htaccess or .user.ini).

; Do not advertise the PHP version (X-Powered-By header).
expose_php = Off

; Errors go to the log, never into the page (paths, queries, configuration).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Never include code from URLs.
allow_url_include = Off

; Sessions: reject session IDs the server did not issue (session fixation).
session.use_strict_mode = 1
