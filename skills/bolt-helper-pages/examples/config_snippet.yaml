# Error & Helper pages configuration snippet for config/bolt/config.yaml
#
# NOTE: In Bolt CMS, error pages are configured globally for a single locale.
# Dynamic locale propagation is pending bolt/core#3726 (https://github.com/bolt/core/pull/3726).
#
# The default content for the "Not Found" (404) page.
notfound: [ 'helper-pages/notfound.404.twig' ]

# Toggle maintenance mode on or off. Note: Logged-in editors will still see the site.
maintenance_mode: false

# The default for the "Maintenance mode" (503) page. A root entrypoint without '/': Bolt looks
# up items containing '/' as contenttype/slug records first, a database query (SKILL.md section 5).
maintenance: [ 'maintenance.503.twig' ]

# The default content for the "Forbidden" (403) page.
forbidden: [ 'helper-pages/forbidden.403.twig' ]

# The default content for the "Internal Server Error" (500) page.
# Note: Used in APP_ENV=prod mode. Kept strictly simple without database queries; the root
# entrypoint internal-server-error.500.twig extends helper-pages/internal-server-error.500.twig.
internal_server_error: [ 'internal-server-error.500.twig' ]
