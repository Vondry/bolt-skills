# config/services.yaml — nothing to add for bolt-runtime-extensions.
#
# Bolt's stock services.yaml already registers every class in src/ with autowiring and
# autoconfiguration (`App\: resource: '../src/*'`), which tags the extensions as Twig
# extensions. Their scalar arguments come from #[Autowire] attributes in the classes:
#
#   LocaleLinkExtension       %app_locales%, %locale%
#   ImageDimensionsExtension  %kernel.project_dir% (+ the cache.app pool, autowired)
#   FileSizeExtension         %kernel.project_dir%
#
# Older projects define the extension explicitly; that still works and can be removed:
#
#   App\LocaleLinkExtension:
#     arguments:
#       $appLocales: '%app_locales%'
#       $defaultLocale: '%locale%'
#     tags: [ 'twig.extension' ]
